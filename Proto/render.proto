syntax = "proto3";

package capstone.render;

enum RenderEventType {
    RENDER_EVENT_UNKNOWN = 0;
    RENDER_TRANSFORM_MOVED = 1;
    RENDER_PLAY_ANIMATION = 2;
    RENDER_SPAWN_ENTITY = 3;
    RENDER_CHANGE_COLOR = 4;
    RENDER_REMOVE_ENTITY = 5;
    RENDER_START_SCENE = 6;
    RENDER_CHANGE_HEALTH = 7;
    RENDER_DISPLAY_MESSAGE = 8;
    RENDER_MODULE_MAPPING = 9;
}

service RenderService {
    rpc StreamEvent (stream RenderEvent) returns (stream RenderReply);
}

message RenderEvent {
    RenderEventType type = 1;
    string entity_id = 2;
    oneof payload {
        TransformMoved transform_moved = 3;
        PlayAnimation play_animation = 4;
        SpawnEntity spawn_entity = 5;
        ChangeColor change_color = 6;
        RemoveEntity remove_entity = 7;
        StartScene start_scene = 8;
        ChangeHealth change_health = 9;
        DisplayMessage display_message = 10;
        ModuleMapping module_mapping = 11;
    }
}

message RenderReply {
    string entity_id = 1;
    string message = 2;
}

message TransformMoved {
    float x = 1;
    float y = 2;
    float z = 3;
}

message PlayAnimation {
    string animation_name = 1;
    string animation_after = 2;
}

message SpawnEntity {
    string entity_type = 1;
    float x = 2;
    float y = 3;
    float z = 4;
}

message ChangeColor {
    int32 r = 1;
    int32 g = 2;
    int32 b = 3;
    int32 a = 4;
}

message RemoveEntity {
}

message StartScene {
    string scene_name = 1;
}

message ChangeHealth {
    int32 health = 1;
}

message DisplayMessage {
    string message = 1;
}

message ModuleMapping {
    string top = 1;
    string bottom = 2;
    string left = 3;
    string right = 4;
    string select = 5;
}
